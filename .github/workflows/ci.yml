name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest
      - name: Check tracked files for obvious secrets
        run: |
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|DASHSCOPE_API_KEY=[^[:space:]]+)' -- \
            ':!*.example' ':!.github/workflows/ci.yml'; then
            echo 'Potential secret found in tracked files.'
            exit 1
          fi
