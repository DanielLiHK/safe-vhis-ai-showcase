[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-vhis-research"
version = "0.1.0"
description = "A bilingual responsible-AI evaluation of grounded VHIS insurance Q&A"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=2.0,<3.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
safe-vhis = "safe_vhis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

